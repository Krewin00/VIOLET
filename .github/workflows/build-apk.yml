

name: Build VIOLET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VIOLET_flutter_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract VIOLET project
        run: |
          unzip -q VIOLET_flutter_project.zip -d project
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/project" -name pubspec.yaml -printf '%h\n' | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --project-name violet .

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under Android SDK: $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Set compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          roots = [
              Path(os.environ["PROJECT_DIR"]) / "android",
              Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          ]

          pattern = re.compile(
              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)'
          )

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.name not in ("build.gradle", "build.gradle.kts"):
                      continue
                  try:
                      old = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  new = pattern.sub(r'\g<1>36', old)
                  if new != old:
                      path.write_text(new)
                      print("Patched:", path)
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIOLET-Android
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
